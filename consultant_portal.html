<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>차카고 · 상담사 전용</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --primary:#2D6A4F;--primary-d:#1B4332;--primary-l:#E9F3EE;
    --purple:#8E44AD;--purple-l:#F3E5F5;--orange:#E67E22;--orange-l:#FEF3E2;
    --blue:#3D7A8A;--blue-l:#E3F2F5;--red:#E74C3C;
    --text:#1A1A2E;--text-mid:#4A4A5A;--text-light:#8A8A9A;
    --bg:#F4F5F7;--bg-gray:#F0F2F5;--border:#E2E5E9;--white:#fff;
  }
  body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}

  /* 로그인 */
  .login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#2D6A4F,#1B4332);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .login-screen.hidden{display:none;}
  .login-box{background:#fff;border-radius:16px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .login-logo{text-align:center;margin-bottom:8px;}
  .login-logo svg{width:60px;height:auto;}
  .login-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px;}
  .login-sub{text-align:center;font-size:13px;color:var(--text-light);margin-bottom:28px;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-mid);}
  .login-field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;}
  .login-field input:focus{outline:none;border-color:var(--primary);}
  .login-btn{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
  .login-btn:hover{background:var(--primary-d);}
  .login-err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:18px;}

  /* 헤더 */
  .header{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;}
  .header-logo svg{width:34px;height:auto;}
  .header-badge{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-l);padding:3px 10px;border-radius:12px;}
  .header-right{display:flex;align-items:center;gap:14px;}
  .header-user{font-size:13px;color:var(--text-mid);}
  .header-logout{font-size:13px;color:var(--text-light);background:none;border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit;}
  .header-logout:hover{background:var(--bg-gray);}

  #mainContent{display:none;}
  .container{max-width:1080px;margin:0 auto;padding:24px 20px 60px;}

  .page-title{font-size:20px;font-weight:800;margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--text-light);margin-bottom:20px;}

  /* 진행상황 요약 칩 */
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .stat-chip{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:92px;}
  .stat-chip .n{font-size:22px;font-weight:800;}
  .stat-chip .l{font-size:12px;color:var(--text-light);margin-top:2px;}
  .stat-chip.total .n{color:var(--text);}

  /* 상담 카드 */
  .booking-card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;}
  .bc-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .bc-head-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .bc-customer{font-size:17px;font-weight:700;}
  .bc-date{font-size:12px;color:var(--text-light);}
  .progress-badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:14px;}
  .pg-접수{background:var(--bg-gray);color:var(--text-mid);}
  .pg-상담진행{background:var(--blue-l);color:var(--blue);}
  .pg-상담완료{background:var(--primary-l);color:var(--primary);}
  .pg-견적안내{background:#FFF3E0;color:var(--orange);}
  .pg-계약완료{background:var(--purple-l);color:var(--purple);}
  .pg-발주진행{background:#E1F5FE;color:#0277BD;}
  .pg-출고완료{background:#E8F5E9;color:#2E7D32;}
  .pg-고객인도{background:#FCE4EC;color:#C2185B;}

  .bc-body{padding:16px 20px;}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 20px;margin-bottom:16px;}
  .info-item{font-size:13px;}
  .info-item .k{color:var(--text-light);font-size:11px;margin-bottom:2px;}
  .info-item .v{color:var(--text);font-weight:500;}

  /* 진행상황 변경 */
  .progress-update{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--bg-gray);border-radius:10px;margin-bottom:16px;flex-wrap:wrap;}
  .progress-update label{font-size:13px;font-weight:600;color:var(--text-mid);}
  .progress-update select{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;flex:1;min-width:120px;}
  .progress-update button{font-family:inherit;font-size:13px;font-weight:600;padding:8px 18px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;}
  .progress-update button:hover{background:var(--primary-d);}

  /* 상담 이력 (댓글) */
  .log-section{border-top:1px solid var(--border);padding-top:16px;}
  .log-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .log-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .log-item{display:flex;gap:12px;padding:12px 14px;background:var(--bg-gray);border-radius:10px;}
  .log-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-l);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .log-content{flex:1;min-width:0;}
  .log-meta{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;}
  .log-name{font-size:13px;font-weight:700;}
  .log-date{font-size:11px;color:var(--text-light);}
  .log-text{font-size:13px;color:var(--text-mid);white-space:pre-wrap;word-break:break-word;}
  .log-del{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;padding:2px 6px;}
  .log-empty{font-size:13px;color:var(--text-light);text-align:center;padding:14px;}

  .log-input-row{display:flex;gap:8px;}
  .log-input-row textarea{flex:1;font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;resize:vertical;min-height:44px;}
  .log-input-row textarea:focus{outline:none;border-color:var(--primary);}
  .log-input-row button{font-family:inherit;font-size:13px;font-weight:600;padding:0 18px;background:var(--purple);color:#fff;border:none;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .log-input-row button:hover{background:#7A379A;}

  .empty{text-align:center;padding:50px 20px;color:var(--text-light);font-size:14px;background:#fff;border-radius:12px;border:1px solid var(--border);}
  .loading{text-align:center;padding:40px;color:var(--text-light);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}

  @media(max-width:600px){
    .header{padding:12px 14px;}.container{padding:16px 12px 40px;}
    .bc-head{padding:14px;}.bc-body{padding:14px;}
  }
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 200 75" xmlns="http://www.w3.org/2000/svg">
        <path d="M15,52 L32,52 L38,24 C42,14 55,10 70,10 L130,10 C145,10 158,14 162,24 L168,52 L185,52" fill="none" stroke="#2D6A4F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="55" cy="56" r="13" fill="none" stroke="#2D6A4F" stroke-width="4.5"/>
        <circle cx="145" cy="56" r="13" fill="none" stroke="#2D6A4F" stroke-width="4.5"/>
      </svg>
    </div>
    <div class="login-title">상담사 전용 페이지</div>
    <div class="login-sub">차카고 상담사 로그인</div>
    <div class="login-field">
      <label>아이디 (이메일)</label>
      <input type="text" id="loginId" placeholder="등록된 이메일 주소" autocomplete="username">
    </div>
    <div class="login-field">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 메인 -->
<div id="mainContent">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg viewBox="0 0 200 75" xmlns="http://www.w3.org/2000/svg">
          <path d="M15,52 L32,52 L38,24 C42,14 55,10 70,10 L130,10 C145,10 158,14 162,24 L168,52 L185,52" fill="none" stroke="#1A1A2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="55" cy="56" r="13" fill="none" stroke="#1A1A2E" stroke-width="4.5"/>
          <circle cx="145" cy="56" r="13" fill="none" stroke="#1A1A2E" stroke-width="4.5"/>
        </svg>
        차카고
      </div>
      <span class="header-badge">상담사</span>
    </div>
    <div class="header-right">
      <span class="header-user" id="headerUser"></span>
      <button class="header-logout" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <div class="page-title" id="welcomeTitle">내 상담 목록</div>
    <div class="page-sub">배정된 상담 건의 진행상황을 업데이트하고 상담 이력을 남길 수 있습니다.</div>

    <div class="stat-row" id="statRow"></div>

    <div id="bookingList">
      <div class="loading">불러오는 중...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API='https://script.google.com/macros/s/AKfycbxTxOojQnjK1wbaqAbHl_hGB1_08PiQroJ-fnvPQna0O2lbHR3EY-vLlGamrxZ3qUm_/exec';
  const SESSION_KEY='chakago_consultant_portal';
  const PROGRESS_STATES=['접수','상담진행','상담완료','견적안내','계약완료','발주진행','출고완료','고객인도'];

  let _me={cid:'',name:'',email:''};

  function esc(s){const d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML;}
  function fmtPhone(p){p=(p||'').toString().replace(/[^0-9]/g,'');if(p.length===10&&p.charAt(0)==='1'&&p.charAt(1)==='0')p='0'+p;if(p.length===11)return p.slice(0,3)+'-'+p.slice(3,7)+'-'+p.slice(7);if(p.length===10)return p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6);return p||'';}
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

  function jsonp(params,cb){
    const cbName='_jp_'+Math.random().toString(36).slice(2);
    window[cbName]=function(d){cb(d);delete window[cbName];s.remove();};
    const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
    const s=document.createElement('script');
    s.src=API+'?'+qs+'&callback='+cbName;
    s.onerror=function(){cb({success:false,message:'네트워크 오류'});delete window[cbName];s.remove();};
    document.body.appendChild(s);
  }
  function post(data,cb){
    fetch(API,{method:'POST',mode:'no-cors',cache:'no-cache',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),redirect:'follow'})
      .then(()=>{if(cb)cb({success:true});}).catch(()=>{if(cb)cb({success:false});});
  }

  // ===== 로그인 =====
  function checkLogin(){return sessionStorage.getItem(SESSION_KEY)==='true';}
  function doLogin(){
    const id=document.getElementById('loginId').value.trim();
    const pw=document.getElementById('loginPw').value.trim();
    const err=document.getElementById('loginErr');
    const btn=document.getElementById('loginBtn');
    if(!id||!pw){err.textContent='아이디와 비밀번호를 입력해 주세요';return;}
    btn.disabled=true;btn.textContent='확인 중...';err.textContent='';
    jsonp({action:'consultantPortalLogin',id:id,pw:pw},function(d){
      btn.disabled=false;btn.textContent='로그인';
      if(d.success){
        _me={cid:d.cid,name:d.name,email:d.email};
        sessionStorage.setItem(SESSION_KEY,'true');
        sessionStorage.setItem(SESSION_KEY+'_data',JSON.stringify(_me));
        showMain();
      }else{
        err.textContent=d.message||'로그인 실패';
        document.getElementById('loginPw').value='';
        document.getElementById('loginPw').focus();
      }
    });
  }
  function showMain(){
    if(!_me.name){ try{_me=JSON.parse(sessionStorage.getItem(SESSION_KEY+'_data'))||{};}catch(e){} }
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainContent').style.display='block';
    document.getElementById('headerUser').textContent=(_me.name||'상담사')+' 님';
    document.getElementById('welcomeTitle').textContent=_me.name+' 상담사님의 상담 목록';
    loadMyBookings();
  }
  function logout(){
    sessionStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY+'_data');
    location.reload();
  }

  document.getElementById('loginBtn').addEventListener('click',doLogin);
  document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('loginId').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPw').focus();});
  document.getElementById('logoutBtn').addEventListener('click',logout);

  // ===== 내 배정 상담 목록 =====
  function loadMyBookings(){
    document.getElementById('bookingList').innerHTML='<div class="loading">불러오는 중...</div>';
    jsonp({action:'myBookings',name:_me.name},function(d){
      if(!d.success){document.getElementById('bookingList').innerHTML='<div class="empty">불러올 수 없습니다</div>';return;}
      renderStat(d.stat);
      renderBookings(d.bookings||[]);
    });
  }

  function renderStat(stat){
    stat=stat||{total:0};
    let html=`<div class="stat-chip total"><div class="n">${stat.total||0}</div><div class="l">전체</div></div>`;
    PROGRESS_STATES.forEach(st=>{
      const c=stat[st]||0;
      if(c>0) html+=`<div class="stat-chip"><div class="n">${c}</div><div class="l">${st}</div></div>`;
    });
    document.getElementById('statRow').innerHTML=html;
  }

  function renderBookings(list){
    const box=document.getElementById('bookingList');
    if(!list||list.length===0){box.innerHTML='<div class="empty">배정된 상담이 없습니다.</div>';return;}
    box.innerHTML=list.map(b=>{
      const pg=b.progress||'접수';
      const opts=PROGRESS_STATES.map(st=>`<option value="${st}" ${st===pg?'selected':''}>${st}</option>`).join('');
      return `<div class="booking-card" id="card_${b.row}">
        <div class="bc-head">
          <div class="bc-head-left">
            <span class="bc-customer">${esc(b.customerName)}</span>
            <span class="progress-badge pg-${esc(pg)}">${esc(pg)}</span>
          </div>
          <span class="bc-date">접수 ${esc(b.date)}</span>
        </div>
        <div class="bc-body">
          <div class="info-grid">
            <div class="info-item"><div class="k">연락처</div><div class="v">${esc(fmtPhone(b.phoneNumber))}</div></div>
            <div class="info-item"><div class="k">관심 차종</div><div class="v">${esc(b.vehicleTypes)||'-'}</div></div>
            <div class="info-item"><div class="k">거주 지역</div><div class="v">${esc(b.region)||'-'}</div></div>
            <div class="info-item"><div class="k">통화 가능시간</div><div class="v">${esc(b.callTime)||'-'}</div></div>
            <div class="info-item"><div class="k">유입 파트너</div><div class="v">${esc(b.partnerName)||'-'}</div></div>
            <div class="info-item"><div class="k">기타 문의</div><div class="v">${esc(b.inquiry)||'없음'}</div></div>
          </div>

          <div class="progress-update">
            <label>상담 진행상황</label>
            <select id="pg_${b.row}">${opts}</select>
            <button onclick="updateProgress(${b.row})">진행상황 변경</button>
          </div>

          <div class="log-section">
            <div class="log-title">💬 상담 이력</div>
            <div class="log-list" id="logs_${b.row}"><div class="log-empty">불러오는 중...</div></div>
            <div class="log-input-row">
              <textarea id="loginput_${b.row}" placeholder="상담 진행 내용을 입력하세요 (예: 부재중 / 견적 안내 완료 등)"></textarea>
              <button onclick="addLog(${b.row})">등록</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
    // 각 카드의 상담 이력 로드
    list.forEach(b=>loadLogs(b.row));
  }

  // 진행상황 변경
  function updateProgress(row){
    const sel=document.getElementById('pg_'+row);
    const progress=sel.value;
    post({type:'updateProgress',bookingRow:row,progress:progress},function(){
      toast('진행상황이 "'+progress+'"(으)로 변경되었습니다');
      // 배지 즉시 갱신
      const badge=document.querySelector('#card_'+row+' .progress-badge');
      if(badge){badge.textContent=progress;badge.className='progress-badge pg-'+progress;}
      setTimeout(loadMyBookings,1500);
    });
  }

  // 상담 이력 로드
  function loadLogs(row){
    jsonp({action:'consultLogs',bookingRow:row},function(d){
      const box=document.getElementById('logs_'+row);
      if(!box)return;
      if(!d.success||!d.logs||d.logs.length===0){box.innerHTML='<div class="log-empty">아직 상담 이력이 없습니다.</div>';return;}
      box.innerHTML=d.logs.map(l=>{
        const initial=(l.consultantName||'?').charAt(0);
        const mine=(l.consultantId===_me.cid);
        return `<div class="log-item">
          <div class="log-avatar">${esc(initial)}</div>
          <div class="log-content">
            <div class="log-meta">
              <span class="log-name">${esc(l.consultantName)}</span>
              <span class="log-date">${esc(l.date)}</span>
              ${mine?`<button class="log-del" onclick="delLog(${l.logRow},${row})">삭제</button>`:''}
            </div>
            <div class="log-text">${esc(l.content)}</div>
          </div>
        </div>`;
      }).join('');
    });
  }

  // 상담 이력 추가
  function addLog(row){
    const ta=document.getElementById('loginput_'+row);
    const content=ta.value.trim();
    if(!content){toast('내용을 입력해 주세요');return;}
    post({type:'addConsultLog',bookingRow:row,consultantId:_me.cid,consultantName:_me.name,content:content},function(){
      ta.value='';
      toast('상담 이력이 등록되었습니다');
      setTimeout(()=>loadLogs(row),1200);
    });
  }

  // 상담 이력 삭제
  function delLog(logRow,bookingRow){
    if(!confirm('이 상담 이력을 삭제하시겠습니까?'))return;
    post({type:'deleteConsultLog',logRow:logRow},function(){
      toast('삭제되었습니다');
      setTimeout(()=>loadLogs(bookingRow),1200);
    });
  }

  // 초기화
  if(checkLogin()){showMain();}
</script>
</body>
</html>
