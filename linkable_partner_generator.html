<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>차카고 - 파트너 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--primary:#2D6A4F;--primary-light:#40916C;--primary-bg:#F0F7F4;--text-dark:#1A1A2E;--text-mid:#4A4A5A;--text-light:#8A8A9A;--bg-white:#FFF;--bg-gray:#F4F5F7;--border:#E2E5E9;--teal:#4A8FA0;--orange:#E67E22;--red:#E74C3C;--shadow-sm:0 1px 3px rgba(0,0,0,.05);--radius:12px;--radius-sm:8px;}
    *{margin:0;padding:0;box-sizing:border-box;} html{font-size:16px;}
    body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg-gray);color:var(--text-dark);line-height:1.6;min-height:100vh;}

    /* 로그인 */
    .login-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#2D6A4F,#1B4332);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
    .login-screen.hidden{display:none;}
    .login-card{background:white;border-radius:20px;padding:40px 36px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
    .login-logo{font-size:28px;font-weight:800;margin-bottom:4px;}
    .login-sub{font-size:13px;color:var(--text-light);margin-bottom:28px;}
    .login-ig{margin-bottom:14px;text-align:left;}
    .login-ig label{font-size:12px;font-weight:600;color:var(--text-mid);display:block;margin-bottom:6px;}
    .login-input{font-family:'Noto Sans KR',sans-serif;width:100%;font-size:16px;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;outline:none;}
    .login-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.1);}
    .login-btn{font-family:'Noto Sans KR',sans-serif;width:100%;font-size:16px;font-weight:700;padding:14px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer;margin-top:8px;}
    .login-btn:hover{background:var(--primary-light);}
    .login-error{font-size:13px;color:var(--red);margin-top:10px;min-height:20px;}

    /* 헤더 */
    .header{background:var(--primary);color:white;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);}
    .header-left{display:flex;align-items:center;gap:16px;}
    .header-logo{font-size:20px;font-weight:800;}
    .header-nav{display:flex;gap:4px;}
    .header-nav a{color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:6px;transition:all .2s;}
    .header-nav a:hover,.header-nav a.active{color:white;background:rgba(255,255,255,.15);}
    .header-right{display:flex;gap:8px;align-items:center;}
    .reload-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer;}
    .reload-btn:hover{background:rgba(255,255,255,.25);}

    /* 컨테이너 */
    .container{max-width:1200px;margin:0 auto;padding:20px 16px 40px;}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

    .panel{background:var(--bg-white);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;}
    .panel-header{padding:18px 20px 14px;border-bottom:2px solid var(--bg-gray);display:flex;align-items:center;justify-content:space-between;}
    .panel-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .panel-badge{font-size:11px;font-weight:700;background:var(--primary-bg);color:var(--primary);padding:2px 8px;border-radius:10px;}
    .panel-body{padding:12px 16px;max-height:calc(100vh - 180px);overflow-y:auto;}

    /* 신청자 카드 */
    .app-card{padding:14px;border-radius:var(--radius-sm);background:var(--bg-gray);margin-bottom:10px;border-left:4px solid var(--orange);}
    .app-card.approved{border-left-color:var(--primary);opacity:.5;}
    .app-card.rejected{border-left-color:#bbb;opacity:.4;}
    .app-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .app-name{font-size:15px;font-weight:700;}
    .app-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
    .app-status.waiting{background:#FEF3E2;color:#E67E22;}
    .app-status.active{background:#E8F5E9;color:#2E7D32;}
    .app-status.rejected{background:#F5F5F5;color:#999;}
    .app-info{font-size:12px;color:var(--text-light);line-height:1.5;margin-bottom:8px;}
    .app-actions{display:flex;gap:6px;}
    .app-btn{font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;padding:6px 14px;border:none;border-radius:5px;cursor:pointer;}
    .app-btn-approve{background:var(--primary);color:white;}
    .app-btn-approve:hover{background:var(--primary-light);}
    .app-btn-reject{background:var(--red);color:white;}
    .app-btn-reject:hover{background:#C0392B;}
    .app-btn:disabled{opacity:.4;cursor:not-allowed;}

    /* 파트너 카드 */
    .ptr-card{display:flex;align-items:center;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-gray);margin-bottom:8px;gap:10px;}
    .ptr-qr{width:40px;height:40px;background:white;border-radius:4px;padding:2px;box-shadow:0 1px 2px rgba(0,0,0,.08);overflow:hidden;flex-shrink:0;cursor:pointer;}
    .ptr-qr:hover{transform:scale(1.08);}
    .ptr-qr canvas,.ptr-qr img{width:100%!important;height:100%!important;display:block;}
    .ptr-meta{flex:1;min-width:0;}
    .ptr-meta-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px;}
    .ptr-pid{font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-bg);padding:1px 7px;border-radius:4px;}
    .ptr-name{font-size:13px;font-weight:600;}
    .ptr-status{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;}
    .ptr-status.active{background:#E8F5E9;color:#2E7D32;}
    .ptr-status.inactive{background:#FFF3E0;color:#E65100;}
    .ptr-url{font-size:11px;color:var(--teal);word-break:break-all;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;text-decoration:none;}
    .ptr-url:hover{text-decoration:underline;color:var(--primary);}
    .ptr-actions{display:flex;gap:4px;flex-shrink:0;}
    .ptr-btn{font-family:'Noto Sans KR',sans-serif;font-size:10px;font-weight:600;padding:5px 8px;border:none;border-radius:4px;cursor:pointer;}
    .ptr-btn-url{background:var(--teal);color:white;}
    .ptr-btn-qr{background:var(--primary);color:white;}
    .ptr-btn-del{background:var(--red);color:white;}

    .empty{text-align:center;color:var(--text-light);font-size:13px;padding:24px 0;}

    /* QR 모달 */
    .qr-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:16px;}
    .qr-overlay.show{display:flex;}
    .qr-modal{background:white;border-radius:16px;padding:28px 24px;text-align:center;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:su .25s ease;}
    @keyframes su{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
    .qr-modal-name{font-size:17px;font-weight:700;margin-bottom:4px;}
    .qr-modal-pid{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:14px;}
    .qr-modal-img{display:inline-block;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:14px;}
    .qr-modal-url{font-size:11px;color:var(--text-light);word-break:break-all;margin-bottom:16px;}
    .qr-modal-acts{display:flex;gap:8px;justify-content:center;}
    .qr-modal-close{font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;background:var(--bg-gray);color:var(--text-mid);border:1px solid var(--border);border-radius:6px;cursor:pointer;}
    .qr-modal-dl{font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;}

    .save-status{text-align:center;font-size:12px;margin-top:8px;min-height:18px;}

    @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
    @media(max-width:600px){
      .header{padding:12px 14px;} .header-logo{font-size:17px;}
      .header-nav a{font-size:12px;padding:5px 8px;}
      .container{padding:12px 10px 32px;}
      .panel-body{max-height:none;}
    }
  </style>
</head>
<body>

  <!-- 로그인 -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">차카고</div>
      <div class="login-sub">파트너 관리 페이지</div>
      <div class="login-ig"><label>아이디</label><input type="text" id="loginId" class="login-input" placeholder="관리자 ID" autocomplete="username"></div>
      <div class="login-ig"><label>비밀번호</label><input type="password" id="loginPw" class="login-input" placeholder="비밀번호" autocomplete="current-password"></div>
      <button class="login-btn" onclick="handleLogin()">로그인</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- 메인 -->
  <div id="mainContent" style="display:none;">
    <div class="header">
      <div class="header-left">
        <span class="header-logo">차카고</span>
        <nav class="header-nav">
          <a href="linkable_dashboard.html">관리자 대시보드</a>
          <a href="linkable_booking_manage.html">상담 예약 관리</a>
          <a href="linkable_partner_generator.html" class="active">파트너 관리</a>
        </nav>
      </div>
      <div class="header-right">
        <button class="reload-btn" onclick="loadAll()">새로고침</button>
      </div>
    </div>

    <div class="container">
      <div class="save-status" id="saveStatus"></div>
      <div class="two-col">
        <!-- 좌: 신청 목록 -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">파트너 신청자 목록 <span class="panel-badge" id="appCount">0</span></div>
          </div>
          <div class="panel-body" id="appList"><div class="empty">불러오는 중...</div></div>
        </div>

        <!-- 우: 파트너 목록 -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">파트너 목록 <span class="panel-badge" id="ptrCount">0</span></div>
          </div>
          <div class="panel-body" id="ptrList"><div class="empty">불러오는 중...</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- QR 모달 -->
  <div class="qr-overlay" id="qrOverlay" onclick="closeQr(event)">
    <div class="qr-modal" onclick="event.stopPropagation()">
      <div class="qr-modal-name" id="mName"></div>
      <div class="qr-modal-pid" id="mPid"></div>
      <div class="qr-modal-img" id="mQr"></div>
      <div class="qr-modal-url" id="mUrl"></div>
      <div class="qr-modal-acts">
        <button class="qr-modal-close" onclick="closeQr()">닫기</button>
        <button class="qr-modal-dl" id="mDl">이미지 저장</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbxTxOojQnjK1wbaqAbHl_hGB1_08PiQroJ-fnvPQna0O2lbHR3EY-vLlGamrxZ3qUm_/exec';
    const BASE = 'https://linkcorp-kr.github.io/booking.html';

    // 로그인
    function checkLogin(){return sessionStorage.getItem('linkable_admin_logged')==='true';}
    function handleLogin(){
      const id=document.getElementById('loginId').value.trim(),pw=document.getElementById('loginPw').value,err=document.getElementById('loginError'),btn=document.querySelector('.login-btn');
      if(!id||!pw){err.textContent='아이디와 비밀번호를 입력해 주세요';return;}
      btn.disabled=true;btn.textContent='확인 중...';err.textContent='';
      const old=document.getElementById('lj');if(old)old.remove();
      window._lr=function(d){btn.disabled=false;btn.textContent='로그인';if(d.success){sessionStorage.setItem('linkable_admin_logged','true');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainContent').style.display='block';loadAll();}else{err.textContent=d.message||'로그인 실패';document.getElementById('loginPw').value='';document.getElementById('loginPw').focus();}};
      const s=document.createElement('script');s.id='lj';s.src=API+'?action=login&id='+encodeURIComponent(id)+'&pw='+encodeURIComponent(pw)+'&callback=_lr&_='+Date.now();s.onerror=function(){btn.disabled=false;btn.textContent='로그인';err.textContent='서버 연결 실패';};document.body.appendChild(s);
    }
    document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
    document.getElementById('loginId').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPw').focus();});

    // 데이터 로드
    function loadAll(){loadApplications();loadPartners();}

    function jsonp(action,cb){
      const id='jp_'+action;const old=document.getElementById(id);if(old)old.remove();
      const fn='_cb_'+action;window[fn]=cb;
      const s=document.createElement('script');s.id=id;s.src=API+'?action='+action+'&callback='+fn+'&_='+Date.now();document.body.appendChild(s);
    }

    // 신청 목록
    function loadApplications(){
      document.getElementById('appList').innerHTML='<div class="empty">불러오는 중...</div>';
      jsonp('applications',function(data){
        if(!data.success||!data.applications){document.getElementById('appList').innerHTML='<div class="empty">불러올 수 없습니다</div>';return;}
        const apps=data.applications;
        const waiting=apps.filter(a=>a.status==='대기중');
        document.getElementById('appCount').textContent=waiting.length;
        if(apps.length===0){document.getElementById('appList').innerHTML='<div class="empty">신청 내역이 없습니다</div>';return;}
        document.getElementById('appList').innerHTML=apps.map(a=>{
          const stCls=a.status==='대기중'?'waiting':a.status==='활성'?'active':'rejected';
          const cardCls=a.status==='활성'?'approved':a.status==='반려'?'rejected':'';
          const disabled=a.status!=='대기중'?'disabled':'';
          return `<div class="app-card ${cardCls}">
            <div class="app-top"><span class="app-name">${esc(a.name)}</span><span class="app-status ${stCls}">${esc(a.status)}</span></div>
            <div class="app-info">📅 ${esc(a.date)} · 📞 ${esc(a.phone)} · ✉️ ${esc(a.email)}<br>🏦 ${esc(a.bank)} ${esc(a.account)}</div>
            <div class="app-actions">
              <button class="app-btn app-btn-approve" ${disabled} onclick="approvePartner(${a.rowIndex},'${esc(a.name)}')">승인</button>
              <button class="app-btn app-btn-reject" ${disabled} onclick="rejectPartner(${a.rowIndex},'${esc(a.name)}')">반려</button>
            </div>
          </div>`;
        }).join('');
      });
    }

    // 파트너 목록
    function loadPartners(){
      document.getElementById('ptrList').innerHTML='<div class="empty">불러오는 중...</div>';
      jsonp('partners',function(data){
        if(!data.success||!data.partners){document.getElementById('ptrList').innerHTML='<div class="empty">불러올 수 없습니다</div>';return;}
        const pts=data.partners;
        document.getElementById('ptrCount').textContent=pts.length;
        if(pts.length===0){document.getElementById('ptrList').innerHTML='<div class="empty">등록된 파트너가 없습니다</div>';return;}
        document.getElementById('ptrList').innerHTML=pts.map((p,i)=>{
          const su=(p.url||'').replace(/'/g,"\\'"),sn=(p.name||'').replace(/'/g,"\\'");
          const isActive=(p.status||'')==='활성';
          return `<div class="ptr-card" id="ptr_${p.pid}">
            <div class="ptr-qr" id="pqr_${i}" onclick="openQr('${sn}','${p.pid}','${su}')" title="QR 확대"></div>
            <div class="ptr-meta">
              <div class="ptr-meta-top"><span class="ptr-pid">${esc(p.pid)}</span><span class="ptr-name">${esc(p.name)}</span><span class="ptr-status ${isActive?'active':'inactive'}">${esc(p.status)}</span></div>
              <a class="ptr-url" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>
            </div>
            <div class="ptr-actions">
              <button class="ptr-btn ptr-btn-url" onclick="copyText('${su}',this)">URL</button>
              <button class="ptr-btn ptr-btn-qr" onclick="dlQr('${sn}','${p.pid}','${su}')">QR</button>
              <button class="ptr-btn ptr-btn-del" onclick="delPartner('${p.pid}','${sn}')">삭제</button>
            </div>
          </div>`;
        }).join('');
        pts.forEach((p,i)=>{const t=document.getElementById('pqr_'+i);if(t&&p.url)genQR(t,p.url,36);});
      });
    }

    // 승인
    async function approvePartner(rowIndex,name){
      if(!confirm(`"${name}" 신청을 승인하시겠습니까?`))return;
      setStatus('saving','승인 처리 중...');
      try{await fetch(API,{method:'POST',mode:'no-cors',cache:'no-cache',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'approvePartner',rowIndex:rowIndex,baseUrl:BASE}),redirect:'follow'});
        setStatus('saved',name+' 파트너 승인 완료');setTimeout(loadAll,1500);
      }catch(e){setStatus('error','승인 실패');}
    }

    // 반려
    async function rejectPartner(rowIndex,name){
      if(!confirm(`"${name}" 신청을 반려하시겠습니까?\n반려 안내 이메일이 발송됩니다.`))return;
      setStatus('saving','반려 처리 중...');
      try{await fetch(API,{method:'POST',mode:'no-cors',cache:'no-cache',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'rejectPartner',rowIndex:rowIndex}),redirect:'follow'});
        setStatus('saved',name+' 반려 완료');setTimeout(loadAll,1500);
      }catch(e){setStatus('error','반려 실패');}
    }

    // 삭제
    async function delPartner(pid,name){
      if(!confirm(`"${name}" (${pid}) 파트너를 삭제하시겠습니까?`))return;
      const row=document.getElementById('ptr_'+pid);if(row){row.style.opacity='.3';row.style.pointerEvents='none';}
      try{await fetch(API,{method:'POST',mode:'no-cors',cache:'no-cache',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'deletePartner',pid:pid}),redirect:'follow'});
        setStatus('saved',pid+' 삭제 완료');setTimeout(loadAll,1500);
      }catch(e){if(row){row.style.opacity='1';row.style.pointerEvents='auto';}setStatus('error','삭제 실패');}
    }

    // QR
    function genQR(c,u,s){c.innerHTML='';new QRCode(c,{text:u,width:s||160,height:s||160,colorDark:'#1A1A2E',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}
    function openQr(n,p,u){
      document.getElementById('mName').textContent=n+' 파트너';document.getElementById('mPid').textContent=p;document.getElementById('mUrl').textContent=u;
      const w=document.getElementById('mQr');genQR(w,u,200);
      document.getElementById('mDl').onclick=function(){setTimeout(()=>{const c=w.querySelector('canvas');if(c)dlImg(c.toDataURL('image/png'),n,p);},50);};
      document.getElementById('qrOverlay').classList.add('show');
    }
    function closeQr(e){if(e&&e.target!==document.getElementById('qrOverlay')&&e.type==='click')return;document.getElementById('qrOverlay').classList.remove('show');}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('qrOverlay').classList.remove('show');});
    function dlImg(d,n,p){const a=document.createElement('a');a.href=d;a.download=`차카고_QR_${n}_${p}.png`;document.body.appendChild(a);a.click();document.body.removeChild(a);}
    function dlQr(n,p,u){const t=document.createElement('div');t.style.cssText='position:fixed;left:-9999px';document.body.appendChild(t);genQR(t,u,300);setTimeout(()=>{const c=t.querySelector('canvas');if(c)dlImg(c.toDataURL('image/png'),n,p);document.body.removeChild(t);},150);}

    // 유틸
    function setStatus(t,m){const el=document.getElementById('saveStatus');el.className='save-status';el.style.color=t==='saved'?'var(--primary)':t==='error'?'var(--red)':'var(--text-light)';el.textContent=m;if(t==='saved')setTimeout(()=>{el.textContent='';},3000);}
    function copyText(t,b){if(navigator.clipboard)navigator.clipboard.writeText(t);else{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}const o=b.textContent;b.textContent='완료';setTimeout(()=>{b.textContent=o;},1500);}
    function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

    // 초기화
    if(checkLogin()){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainContent').style.display='block';loadAll();}else{document.getElementById('loginId').focus();}
  </script>
</body>
</html>
