<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차카고</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-color: #f6f8fc;
      --text-color: #173b7a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-color);
      font-family: "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeUp 1s ease-out forwards;
      opacity: 0;
      transform: translateY(18px);
    }

    .car-silhouette {
      width: clamp(140px, 22vw, 220px);
      margin: 0 auto 6px;
      opacity: 0;
      transform: translateY(10px);
      animation:
        curveIn 1s ease-out 0.15s forwards,
        floatSoft 2.8s ease-in-out 1.2s infinite;
    }

    .car-silhouette svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .logo-text {
      color: var(--text-color);
      font-size: clamp(2.2rem, 7vw, 4.8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      user-select: none;
      opacity: 0;
      transform: translateY(14px);
      animation: textIn 0.9s ease-out 0.3s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes curveIn {
      to {
        opacity: 0.95;
        transform: translateY(0);
      }
    }

    @keyframes textIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatSoft {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container,
      .car-silhouette,
      .logo-text {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="car-silhouette">
      <svg viewBox="0 0 200 75" xmlns="http://www.w3.org/2000/svg">
        <path d="M15,52 L32,52 L38,24 C42,14 55,10 70,10 L130,10 C145,10 158,14 162,24 L168,52 L185,52"
          fill="none" stroke="#173b7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="55" cy="56" r="13" fill="none" stroke="#173b7a" stroke-width="4.5"/>
        <circle cx="145" cy="56" r="13" fill="none" stroke="#173b7a" stroke-width="4.5"/>
      </svg>
    </div>
    <div class="logo-text">차카고</div>
  </div>
</body>
</html>
